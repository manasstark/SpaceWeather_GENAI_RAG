# Every parameter the pipeline uses. The code in src/spacewx_rag/ reads this file
# (spacewx_rag.utils.config.load_params). Notebooks 01-05 hold the same values in code; the
# regression tests in tests/ check that src/ reproduces their outputs exactly.

analysis_window:
  start: "2016-07-26 00:00"          # DSCOVR operational
  end: "2026-06-29 23:00"            # end of the published DSCOVR archive

alignment:
  min_valid_minutes_per_hour: 45
  magnetometer_blank_flags: [maneuver_flag, possible_saturation_flag]
  plasma_fallback_flag_share: 0.75    # hours with >= 75% reduced_proton_quality minutes use OMNI plasma
  fill_magnetometer_from_omni: true   # decision 14
  delay_distance_km: 1.5e6            # delay = distance / speed
  speed_when_missing_km_s: 430.0
  f107_column: F10.7_ADJ              # adjusted; observed also stored (decision 7, proposed)
  f107_spike: {median_window_days: 7, min_periods: 4, factor: 1.3}

events:
  storm:
    dst_threshold_nT: -50
    merge_gap_hours: 12
    lookback_hours: 12
    recovery_level_nT: -30
    recovery_cap_hours: 72
    classes: {moderate: [-100, -50], intense: [-250, -100], super: [-1000, -250]}
    marginal: {max_core_hours: 3, min_dst_above_nT: -60}
    driver_lookback_hours: 12         # window for vbs_mean_12h_before_min
  quiet:
    window_hours: 48
    dst_above_nT: -30
    kp_max: 3
    min_field_dscovr_share: 0.90
    min_plasma_any_share: 0.95
    buffer_hours_from_storms: 24
    sample: {total: 100, f107_bands: {"<100": 34, "100-150": 33, ">150": 33}, random_seed: 42}

cards:
  hints:
    g_level_kp_thresholds: {G1: 5, G2: 6, G3: 7, G4: 8, G5: 9}
    sustained_southward_bz: {threshold_nT: -5, min_hours: 6}
    strongly_southward_bz_nT: -20
    solar_wind_speed_km_s: {fast: 600, very_fast: 800}
    dynamic_pressure_high_nPa: 10
    electric_field_strong_mV_m: 5
    f107_levels: {low_below: 100, high_above: 150}
  caveat_thresholds: {plasma_dscovr_pct_low: 50, plasma_dscovr_pct_partial: 80, field_dscovr_pct_below: 90}

knowledge_base:
  chunking: {chunk_size: 900, chunk_overlap: 120, min_chunk_chars: 120}
  embedding: {model: BAAI/bge-small-en-v1.5, normalize: true,
              query_prefix: "Represent this sentence for searching relevant passages: "}
  vector_store: {type: chroma, collection: spaceweather_kb, metric: cosine}
  event_documents: {role: event_2024_may, window: ["2024-05-08", "2024-05-20"]}

retrieval:
  top_k: 3                            # per query
  impact_top_k: 2                     # per impact-area query (decision 41)
  impact_areas:                       # one query per area, storms only
    power systems: "Effects of a {g} geomagnetic storm on power grids and transformers"
    satellites and spacecraft: "Effects of a {g} geomagnetic storm on satellite drag, orientation and spacecraft charging"
    GNSS navigation: "Effects of a {g} geomagnetic storm on GPS and GNSS navigation accuracy"
    HF radio: "Effects of a {g} geomagnetic storm on HF radio communication"
    aurora: "How far from the poles aurora can be seen during a {g} geomagnetic storm"

generation:
  provider: ollama                    # ollama | baseline (overridden by LLM_PROVIDER in .env)
  model: qwen2.5:7b-instruct          # overridden by LLM_MODEL in .env
  temperature: 0.0                    # single deterministic run per event
  consistency_temperature: 0.7        # repeated runs for the consistency metric
  consistency_runs: 3
  num_ctx: 8192                       # Ollama's default 4096 is too small for card + passages
  num_predict: 1500
  seed: 42
  max_list_items: 6                   # cap on evidence/sources lists (added after E039 looped; decision 55)
  keep_alive: 30m                     # keep the model loaded between requests (faster live demo)

evaluation:
  judge_model: qwen2.5:7b-instruct    # same local model; a stated limitation
  judge_temperature: 0.0
  judge_version: v2                   # v1 was lenient (decision 56)
  number_tolerance: 0.051             # |stated - card| allowed for numbers (rounding to 0.1)

live:                                 # demo extension: the last day of real-time NOAA SWPC data (decision 57)
  base_url: https://services.swpc.noaa.gov
  feeds:
    wind: json/rtsw/rtsw_wind_1m.json         # 1-minute plasma, every L1 monitor; use the "active" one
    mag: json/rtsw/rtsw_mag_1m.json           # 1-minute field (GSM)
    kp: products/noaa-planetary-k-index.json  # 3-hourly planetary Kp (preliminary)
    dst: products/kyoto-dst.json              # Kyoto real-time (quick-look) Dst
    f107: json/f107_cm_flux.json              # observed 10.7 cm flux, three readings a day
  window_hours: 24                    # the real-time solar wind feed covers about 24 hours
  context_days: 7                     # Kp and Dst shown around the window
  min_valid_minutes: 30
  timeout_s: 20
